[project]
name = "vitalteen-server"
version = "0.1.0"
description = "VitalTeen 决策服务：Laya 决策模型编排、矫正方案库、报告生成"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.9",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# ../domain/src 是为了让端到端测试能 import 领域层参考实现。
# 本仓库是单仓多包，这个相对路径是稳定的；单独 checkout server/ 时该路径不存在，
# 相关的集成测试会自行 skip（见 test_integration.py 的 importorskip）。
pythonpath = [".", "../domain/src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
